# Nom du projet Compose -> prefixe des conteneurs (dofus-cockpit-db-1, -api-1, -backend-1).
name: dofus-cockpit

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-dofus}
      POSTGRES_USER: ${DB_USER:-dofus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dofus}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-dofus} -d ${DB_NAME:-dofus}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Sniffer réseau (capture live, Linux + host networking).
  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dofus}
      DB_USER: ${DB_USER:-dofus}
      DB_PASSWORD: ${DB_PASSWORD:-dofus}
      CAPTURE_INTERFACE: ${CAPTURE_INTERFACE:-}
      CAPTURE_BPF_FILTER: ${CAPTURE_BPF_FILTER:-tcp port 443}
      CAPTURE_DEBUG_DUMP: ${CAPTURE_DEBUG_DUMP:-}

  # API REST + tableau de bord. app/ monté en volume + --reload : les éditions
  # (Python et page web) sont prises en compte sans rebuild.
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: [ "uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]
    volumes:
      - ./app:/srv/app
      - ./data:/srv/data       # captures : POST /live/ingest + watcher live
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dofus}
      DB_USER: ${DB_USER:-dofus}
      DB_PASSWORD: ${DB_PASSWORD:-dofus}
      # Dossier surveillé pour le suivi live (ring-buffer dumpcap). Vide = off.
      LIVE_CAPTURE_DIR: ${LIVE_CAPTURE_DIR:-}

volumes:
  pgdata:
    # On garde le volume existant (cree sous l'ancien nom de projet) pour ne PAS
    # perdre la base (roster, stock, build, historique repop) apres le renommage.
    name: pythonproject_pgdata
